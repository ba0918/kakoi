<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img" aria-label="DNS許可の期限と、始まった通信の寿命"><rect width="920" height="380" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536579"/></marker></defs><g font-family="sans-serif" fill="#162c43"><text x="32" y="40" font-size="24" font-weight="bold">DNS許可の期限と、始まった通信の寿命</text><polyline points="262,122 342,122" fill="none" stroke="#536579" stroke-width="2" marker-end="url(#arrow)"/><polyline points="582,122 662,122" fill="none" stroke="#536579" stroke-width="2" marker-end="url(#arrow)"/><polyline points="774,155 774,245" fill="none" stroke="#536579" stroke-width="2" marker-end="url(#arrow)"/><polyline points="405,155 405,200 207,200 207,245" fill="none" stroke="#536579" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="90" width="230" height="65" rx="10" fill="#eaf3ff" stroke="#8194a8"/><text x="147.0" y="129.5" text-anchor="middle" font-size="19">DNS応答のIPを検査</text><rect x="342" y="90" width="240" height="65" rx="10" fill="#e6f5ed" stroke="#8194a8"/><text x="462.0" y="116.5" text-anchor="middle" font-size="19">TTLの期限まで</text><text x="462.0" y="142.5" text-anchor="middle" font-size="19">新規通信を許可</text><rect x="662" y="90" width="225" height="65" rx="10" fill="#f0f3f7" stroke="#8194a8"/><text x="774.5" y="129.5" text-anchor="middle" font-size="19">期限切れ</text><rect x="530" y="245" width="355" height="90" rx="10" fill="#fff0ed" stroke="#8194a8"/><text x="707.5" y="284.0" text-anchor="middle" font-size="19">新規通信は他の許可で再判定</text><text x="707.5" y="310.0" text-anchor="middle" font-size="19">有効な許可がなければ拒否</text><rect x="32" y="245" width="350" height="90" rx="10" fill="#eaf3ff" stroke="#8194a8"/><text x="207.0" y="284.0" text-anchor="middle" font-size="19">期限内に始まったTCP・UDP</text><text x="207.0" y="310.0" text-anchor="middle" font-size="19">それぞれの継続規則で扱う</text><text x="555" y="186" text-anchor="middle" font-size="17">期限の到来だけでは中断しない</text></g></svg>
