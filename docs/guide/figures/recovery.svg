<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-label="通信制限を維持できなくなったとき"><rect width="920" height="470" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536579"/></marker></defs><g font-family="sans-serif" fill="#162c43"><text x="32" y="40" font-size="24" font-weight="bold">通信制限を維持できなくなったとき</text><polyline points="355,140 220,140 220,210" fill="none" stroke="#536579" stroke-width="2" marker-end="url(#arrow)"/><polyline points="565,140 698,140 698,210" fill="none" stroke="#536579" stroke-width="2" marker-end="url(#arrow)"/><polyline points="220,280 220,365" fill="none" stroke="#536579" stroke-width="2" marker-end="url(#arrow)"/><polyline points="407,398 570,398" fill="none" stroke="#536579" stroke-width="2" marker-end="url(#arrow)"/><polyline points="32,398 15,398 15,245 32,245" fill="none" stroke="#536579" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="80" width="380" height="60" rx="10" fill="#eaf3ff" stroke="#8194a8"/><text x="460.0" y="117.0" text-anchor="middle" font-size="19">通信経路を確実に遮断できるか</text><rect x="32" y="210" width="375" height="70" rx="10" fill="#e6f5ed" stroke="#8194a8"/><text x="219.5" y="252.0" text-anchor="middle" font-size="19">遮断して内側の処理を継続</text><rect x="510" y="210" width="375" height="70" rx="10" fill="#fff0ed" stroke="#8194a8"/><text x="697.5" y="239.0" text-anchor="middle" font-size="19">猶予なしで環境を終了</text><text x="697.5" y="265.0" text-anchor="middle" font-size="19">終了コード125</text><rect x="32" y="365" width="375" height="65" rx="10" fill="#eaf3ff" stroke="#8194a8"/><text x="219.5" y="404.5" text-anchor="middle" font-size="19">制限を再構築し、検証する</text><rect x="570" y="365" width="250" height="65" rx="10" fill="#e6f5ed" stroke="#8194a8"/><text x="695.0" y="404.5" text-anchor="middle" font-size="19">通信を復帰</text><text x="265" y="181" text-anchor="middle" font-size="17">できる</text><text x="652" y="181" text-anchor="middle" font-size="17">できない</text><text x="490" y="385" text-anchor="middle" font-size="17">成功</text><text x="65" y="323" text-anchor="middle" font-size="17">失敗</text></g></svg>
