name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'Cargo.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build the static site
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import tomllib

          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          html = Path('site/index.html').read_text()
          html = html.replace('__KAKOI_VERSION__', version).replace('__KAKOI_COMMIT__', os.environ['GITHUB_SHA'])
          output = Path('_site')
          output.mkdir(exist_ok=True)
          (output / 'index.html').write_text(html)
          for asset in ('style.css', 'app.js'):
              shutil.copyfile(Path('site') / asset, output / asset)
          PY

      - name: Upload the site only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
