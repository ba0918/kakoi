name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'Cargo.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Build and deploy the site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write # deploy-pages publishes the uploaded artifact
      id-token: write # deploy-pages proves the run's identity with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Python for the site build
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install site dependencies
        run: python -m pip install --require-hashes -r site/requirements.txt

      - name: Set up Node.js for the formatter
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # A deploying job restores no cache.
          package-manager-cache: false

      - name: Install the formatter from the lockfile
        run: npm ci --prefix site --ignore-scripts --no-audit --no-fund

      - name: Check the site formatting
        run: site/node_modules/.bin/oxfmt --check site

      - name: Build and check the static site
        run: |
          python3 site/test_build.py
          python3 site/build.py --out _site
          python3 site/check.py --out _site

      - name: Upload the site only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
