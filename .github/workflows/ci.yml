# The checks PROJECT.md calls locally reproducible, run on every push and pull request.
name: CI

on:
  push:
  pull_request:

# The workflow only reads the repository; nothing here writes to it.
permissions:
  contents: read

# A newer push on the same ref supersedes an older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The target the release is built for. It appears here as well so that the checks and
  # the published binary are built the same way.
  PUBLISHED_TARGET: x86_64-unknown-linux-musl

jobs:
  check:
    # Pinned rather than ubuntu-latest: the label is moving to 26.04, and the image
    # decides whether an unprivileged user namespace can be created at all, which is
    # the one thing every test that starts the binary depends on.
    runs-on: ubuntu-24.04

    # Both targets run the whole suite. The published binary is the musl one, and the
    # two libc implementations do not agree on the type of every constant, so a suite
    # that passes against glibc is not evidence about what is shipped.
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # PROJECT.md: the tests that start the binary need bwrap 0.9.0 or later, git 2.x,
      # and python3, and fail rather than skip when one is missing. The versions are
      # printed so a missing requirement reads as a version line, not as a test failure.
      - name: Install bubblewrap and report the test requirements
        run: |
          sudo apt-get update
          # musl-tools: rustls's ring compiles C for the musl target with musl's gcc.
          sudo apt-get install -y bubblewrap nftables iproute2 openssl musl-tools
          bwrap --version
          git --version
          python3 --version
          nft --version

      # The filtered tests carry real traffic through pasta. Ubuntu's own package is older
      # than the release the initial filtered support was verified with, so that Debian
      # backports build is fetched, checked against its published digest, and unpacked
      # (not installed). The tests find it through KAKOI_TEST_PASTA.
      - name: Fetch the verified pasta
        run: |
          url=https://deb.debian.org/debian/pool/main/p/passt/passt_0.0~git20260728.f8df3f1-1~bpo13+1_amd64.deb
          curl -fsSLo "$RUNNER_TEMP/passt.deb" "$url"
          echo "c8ac47eb51979289f8bbb1761d9954cf1ee8dd1ac42ea5d2ce5136330099f43a  $RUNNER_TEMP/passt.deb" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/passt.deb" "$RUNNER_TEMP/passt"
          "$RUNNER_TEMP/passt/usr/bin/pasta" --version
          echo "KAKOI_TEST_PASTA=$RUNNER_TEMP/passt/usr/bin/pasta" >> "$GITHUB_ENV"

      # Ubuntu 23.10 and later set kernel.apparmor_restrict_unprivileged_userns=1, which
      # stops bwrap from creating the namespace ("setting up uid map: Permission denied").
      # The runner is a throwaway VM, so the restriction is lifted rather than replaced by
      # an AppArmor profile. The guard keeps the step correct on an image without the knob.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl kernel.apparmor_restrict_unprivileged_userns
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "no apparmor_restrict_unprivileged_userns knob on this image"
          fi

      - name: cargo build
        run: cargo build --workspace --locked --target ${{ matrix.target }}

      - name: cargo test
        run: cargo test --workspace --all-targets --locked --target ${{ matrix.target }}

      # Formatting does not depend on the target, so one of the two runs it.
      - name: cargo fmt
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings

      # The setup skill carries its own copy of the shim template, because a skill
      # installed on its own has no source tree beside it. Two copies can drift, so the
      # check is here rather than left to whoever edits one of them.
      - name: The skill's copy of the shim template matches the original
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: diff examples/shim/codex skills/kakoi-setup/assets/shim/codex

  msrv:
    # Cargo.toml declares rust-version = "1.88"; this job is what makes that claim true.
    # It builds only: the behaviour is covered by `check`, and bwrap is not needed here.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - name: cargo build on the minimum supported Rust version
        run: cargo build --workspace --locked

  userns-restriction:
    # Ubuntu 23.10 and later restrict unprivileged user namespaces, and `filtered` makes
    # them outside bwrap (kakoi itself and pasta), where the bwrap AppArmor profile does
    # not reach. getting-started.md states the outcome; this job keeps it true: with the
    # restriction on, a `filtered` launch stops with 125 before the command runs, profile
    # loaded or not, and with it off the command reaches what it is allowed to.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # apparmor-profiles carries the bwrap profile, which the runner image does not.
      - name: Install bubblewrap, nftables, and the bwrap profile
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap nftables iproute2 apparmor-profiles

      # The same verified build `check` uses. Here it goes on PATH, where the product looks.
      - name: Fetch the verified pasta
        run: |
          url=https://deb.debian.org/debian/pool/main/p/passt/passt_0.0~git20260728.f8df3f1-1~bpo13+1_amd64.deb
          curl -fsSLo "$RUNNER_TEMP/passt.deb" "$url"
          echo "c8ac47eb51979289f8bbb1761d9954cf1ee8dd1ac42ea5d2ce5136330099f43a  $RUNNER_TEMP/passt.deb" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/passt.deb" "$RUNNER_TEMP/passt"
          echo "$RUNNER_TEMP/passt/usr/bin" >> "$GITHUB_PATH"

      - name: cargo build
        run: cargo build --locked

      # The allowed destination is a server on the runner's own loopback, so the check
      # does not depend on anything outside the runner.
      - name: Launch with the restriction on and off
        run: |
          kakoi=$PWD/target/debug/kakoi
          out=$RUNNER_TEMP/out
          policy=$RUNNER_TEMP/filtered.toml
          cat > "$policy" <<'EOF'
          [network]
          mode = "filtered"

          [[network.allow]]
          destination = { host-loopback = "ipv4" }
          protocol = "tcp"
          ports = ["18080"]
          EOF
          mkdir "$RUNNER_TEMP/site"
          echo "served by the runner" > "$RUNNER_TEMP/site/index.html"
          python3 -m http.server 18080 --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" &
          timeout 10 sh -c 'until curl -fs http://127.0.0.1:18080/ >/dev/null; do sleep 0.2; done'
          reach='import urllib.request; print("command ran"); print(urllib.request.urlopen("http://host-v4.kakoi.internal:18080/", timeout=5).read().decode().strip())'

          failed=0
          launch() {
            set +e
            timeout 60 "$@" > "$out" 2>&1
            code=$?
            set -e
            cat "$out"
            echo "exit $code"
          }
          fail() {
            echo "::error::$1"
            failed=1
          }
          refused() {
            launch "$kakoi" --policy-file "$policy" -- python3 -c "$reach"
            [ "$code" -eq 125 ] || fail "$1: filtered exited $code, expected 125"
            grep -qF 'create user/network namespace: Permission denied' "$out" \
              || fail "$1: filtered did not name the refused namespace"
            ! grep -qF 'command ran' "$out" || fail "$1: the command ran"
          }

          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          refused "restricted"

          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sudo apparmor_parser -r "$profile"
          launch "$kakoi" -- true
          [ "$code" -eq 0 ] || fail "restricted with the bwrap profile: host exited $code"
          refused "restricted with the bwrap profile"
          sudo apparmor_parser -R "$profile"

          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          launch "$kakoi" --policy-file "$policy" -- python3 -c "$reach"
          [ "$code" -eq 0 ] || fail "unrestricted: filtered exited $code"
          grep -qF 'served by the runner' "$out" || fail "unrestricted: the allowed server was not reached"

          exit "$failed"

  release:
    # The tag confirms the checks passed; it never starts them, so this job waits for
    # every check. It runs on every push to main and releases nothing unless the manifest's
    # version has a dated changelog heading and a comparison link and no tag yet, so an
    # ordinary push is a no-op and a release is cut by promoting the changelog.
    needs: [check, msrv, userns-restriction]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    # The only job that writes: it creates the tag and the release.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.PUBLISHED_TARGET }}

      # rustls's ring compiles C for the musl target with musl's gcc.
      - name: Install the musl C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      # Specification section 17: Cargo.toml is the only place the version lives, under
      # `[workspace.package]`, from which both packages inherit it.
      - name: Decide whether this commit is a release
        id: decide
        run: |
          version=$(awk -F'"' '
            /^\[workspace\.package\]/ { p = 1; next }
            /^\[/          { p = 0 }
            p && /^version[ \t]*=/ { print $2; exit }
          ' Cargo.toml)
          if [ -z "$version" ]; then
            echo "no version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "the manifest says $version"

          if ! grep -qF "## [$version] - " CHANGELOG.md; then
            echo "the changelog has no released heading for $version; nothing to release"
            exit 0
          fi
          if grep -F "## [$version] - " CHANGELOG.md | grep -q "Unreleased"; then
            echo "the changelog heading for $version is still unreleased; nothing to release"
            exit 0
          fi
          if ! grep -qF "[$version]: " CHANGELOG.md; then
            echo "the changelog has no comparison link for $version; nothing to release"
            exit 0
          fi
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null
          asked=$?
          set -e
          case $asked in
            0) echo "v$version is already published; leaving it alone"; exit 0 ;;
            2) ;;
            *) echo "origin could not be asked about v$version (git ls-remote exited $asked)"
               exit 1 ;;
          esac
          echo "release=true" >> "$GITHUB_OUTPUT"

      # Specification section 17 states the release is consistent when the version of
      # `--version`, of Cargo.toml, and of the tag agree. The binary asked here is the
      # one that will be published, not a host build that happens to sit beside it.
      - name: Build the binary that will be published
        if: steps.decide.outputs.release == 'true'
        run: |
          cargo build --release --locked --target "$PUBLISHED_TARGET"
          binary="target/$PUBLISHED_TARGET/release/kakoi"
          printed=$("$binary" --version)
          expected="kakoi ${{ steps.decide.outputs.version }}"
          if [ "$printed" != "$expected" ]; then
            echo "--version prints '$printed', the manifest says '$expected'"
            exit 1
          fi
          echo "$printed"
          file "$binary"

      # The archive's name is what an installer reads to decide the download fits the
      # machine, so the target triple stays in it. The binary sits at the root of the
      # archive: a directory inside would leave finding it to the installer.
      - name: Package the binary
        id: package
        if: steps.decide.outputs.release == 'true'
        run: |
          version=${{ steps.decide.outputs.version }}
          name="kakoi-v$version-$PUBLISHED_TARGET"
          mkdir -p dist
          cp "target/$PUBLISHED_TARGET/release/kakoi" dist/
          tar -czf "$name.tar.gz" -C dist kakoi
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          tar -tzf "$name.tar.gz"
          cat "$name.tar.gz.sha256"
          echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Take the release notes from the changelog
        if: steps.decide.outputs.release == 'true'
        run: |
          awk -v v="${{ steps.decide.outputs.version }}" '
            index($0, "## [" v "] - ") == 1 { f = 1; next }
            f && index($0, "## ") == 1      { exit }
            f && /^\[[^]]+\]: /             { exit }
            f                               { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "the changelog section for this version is empty"
            exit 1
          fi
          cat notes.md

      - name: Create the tag and the release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ steps.decide.outputs.version }}
          archive=${{ steps.package.outputs.archive }}
          gh release create "v$version" \
            --title "v$version" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            "$archive" "$archive.sha256"

      # The tag exists once the command above returns. A release whose files failed to
      # upload would leave an installer with nothing to fetch, so what the release now
      # carries is read back rather than assumed.
      - name: Check that the release carries the binary and its checksum
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ steps.decide.outputs.version }}
          gh release view "v$version" --json assets -q '.assets[].name'
          count=$(gh release view "v$version" --json assets -q '.assets | length')
          if [ "$count" -ne 2 ]; then
            echo "the release carries $count files, expected the archive and its checksum"
            exit 1
          fi
