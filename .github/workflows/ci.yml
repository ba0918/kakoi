# The checks PROJECT.md calls locally reproducible, run on every push and pull request.
name: CI

on:
  push:
  pull_request:

# The workflow only reads the repository; nothing here writes to it.
permissions:
  contents: read

# A newer push on the same ref supersedes an older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Pinned rather than ubuntu-latest: the label is moving to 26.04, and the image
    # decides whether an unprivileged user namespace can be created at all, which is
    # the one thing every test that starts the binary depends on.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # PROJECT.md: the tests that start the binary need bwrap 0.9.0 or later, git 2.x,
      # and python3, and fail rather than skip when one is missing. The versions are
      # printed so a missing requirement reads as a version line, not as a test failure.
      - name: Install bubblewrap and report the test requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
          git --version
          python3 --version

      # Ubuntu 23.10 and later set kernel.apparmor_restrict_unprivileged_userns=1, which
      # stops bwrap from creating the namespace ("setting up uid map: Permission denied").
      # The runner is a throwaway VM, so the restriction is lifted rather than replaced by
      # an AppArmor profile. The guard keeps the step correct on an image without the knob.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl kernel.apparmor_restrict_unprivileged_userns
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "no apparmor_restrict_unprivileged_userns knob on this image"
          fi

      - name: cargo build
        run: cargo build --locked

      - name: cargo test
        run: cargo test --all-targets --locked

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  msrv:
    # Cargo.toml declares rust-version = "1.85"; this job is what makes that claim true.
    # It builds only: the behaviour is covered by `check`, and bwrap is not needed here.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: Swatinem/rust-cache@v2

      - name: cargo build on the minimum supported Rust version
        run: cargo build --locked

  release:
    # The tag confirms the checks passed; it never starts them, so this job waits for
    # both. It runs on every push to main and releases nothing unless the manifest's
    # version has a dated changelog heading and a comparison link and no tag yet, so an
    # ordinary push is a no-op and a release is cut by promoting the changelog.
    needs: [check, msrv]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    # The only job that writes: it creates the tag and the release.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Specification section 17: Cargo.toml is the only place the version lives.
      - name: Decide whether this commit is a release
        id: decide
        run: |
          version=$(awk -F'"' '
            /^\[package\]/ { p = 1; next }
            /^\[/          { p = 0 }
            p && /^version[ \t]*=/ { print $2; exit }
          ' Cargo.toml)
          if [ -z "$version" ]; then
            echo "no version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "the manifest says $version"

          if ! grep -qF "## [$version] - " CHANGELOG.md; then
            echo "the changelog has no released heading for $version; nothing to release"
            exit 0
          fi
          if grep -F "## [$version] - " CHANGELOG.md | grep -q "Unreleased"; then
            echo "the changelog heading for $version is still unreleased; nothing to release"
            exit 0
          fi
          if ! grep -qF "[$version]: " CHANGELOG.md; then
            echo "the changelog has no comparison link for $version; nothing to release"
            exit 0
          fi
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null
          asked=$?
          set -e
          case $asked in
            0) echo "v$version is already published; leaving it alone"; exit 0 ;;
            2) ;;
            *) echo "origin could not be asked about v$version (git ls-remote exited $asked)"
               exit 1 ;;
          esac
          echo "release=true" >> "$GITHUB_OUTPUT"

      # Specification section 17 states the release is consistent when the version of
      # `--version`, of Cargo.toml, and of the tag agree. The first two are checked here;
      # the tag is named from the same value below.
      - name: Check that --version agrees with the manifest
        if: steps.decide.outputs.release == 'true'
        run: |
          cargo build --locked
          printed=$(./target/debug/process-wrap --version)
          expected="process-wrap ${{ steps.decide.outputs.version }}"
          if [ "$printed" != "$expected" ]; then
            echo "--version prints '$printed', the manifest says '$expected'"
            exit 1
          fi
          echo "$printed"

      - name: Take the release notes from the changelog
        if: steps.decide.outputs.release == 'true'
        run: |
          awk -v v="${{ steps.decide.outputs.version }}" '
            index($0, "## [" v "] - ") == 1 { f = 1; next }
            f && index($0, "## ") == 1      { exit }
            f && /^\[[^]]+\]: /             { exit }
            f                               { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "the changelog section for this version is empty"
            exit 1
          fi
          cat notes.md

      - name: Create the tag and the release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ steps.decide.outputs.version }}
          gh release create "v$version" \
            --title "v$version" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
