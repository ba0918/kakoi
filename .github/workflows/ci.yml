# The checks PROJECT.md calls locally reproducible, run on every push and pull request.
name: CI

on:
  push:
  pull_request:

# The workflow only reads the repository; nothing here writes to it.
permissions:
  contents: read

# A newer push on the same ref supersedes an older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The target the release is built for. It appears here as well so that the checks and
  # the published binary are built the same way.
  PUBLISHED_TARGET: x86_64-unknown-linux-musl

jobs:
  check:
    # Pinned rather than ubuntu-latest: the label is moving to 26.04, and the image
    # decides whether an unprivileged user namespace can be created at all, which is
    # the one thing every test that starts the binary depends on.
    runs-on: ubuntu-24.04

    # Both targets run the whole suite. The published binary is the musl one, and the
    # two libc implementations do not agree on the type of every constant, so a suite
    # that passes against glibc is not evidence about what is shipped.
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # PROJECT.md: the tests that start the binary need bwrap 0.9.0 or later, git 2.x,
      # and python3, and fail rather than skip when one is missing. The versions are
      # printed so a missing requirement reads as a version line, not as a test failure.
      - name: Install bubblewrap and report the test requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
          git --version
          python3 --version

      # Ubuntu 23.10 and later set kernel.apparmor_restrict_unprivileged_userns=1, which
      # stops bwrap from creating the namespace ("setting up uid map: Permission denied").
      # The runner is a throwaway VM, so the restriction is lifted rather than replaced by
      # an AppArmor profile. The guard keeps the step correct on an image without the knob.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl kernel.apparmor_restrict_unprivileged_userns
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "no apparmor_restrict_unprivileged_userns knob on this image"
          fi

      - name: cargo build
        run: cargo build --locked --target ${{ matrix.target }}

      - name: cargo test
        run: cargo test --all-targets --locked --target ${{ matrix.target }}

      # Formatting does not depend on the target, so one of the two runs it.
      - name: cargo fmt
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked --target ${{ matrix.target }} -- -D warnings

      # The setup skill carries its own copy of the shim template, because a skill
      # installed on its own has no source tree beside it. Two copies can drift, so the
      # check is here rather than left to whoever edits one of them.
      - name: The skill's copy of the shim template matches the original
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: diff examples/shim/codex skills/kakoi-setup/assets/shim/codex

  msrv:
    # Cargo.toml declares rust-version = "1.85"; this job is what makes that claim true.
    # It builds only: the behaviour is covered by `check`, and bwrap is not needed here.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: Swatinem/rust-cache@v2

      - name: cargo build on the minimum supported Rust version
        run: cargo build --locked

  release:
    # The tag confirms the checks passed; it never starts them, so this job waits for
    # both. It runs on every push to main and releases nothing unless the manifest's
    # version has a dated changelog heading and a comparison link and no tag yet, so an
    # ordinary push is a no-op and a release is cut by promoting the changelog.
    needs: [check, msrv]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    # The only job that writes: it creates the tag and the release.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.PUBLISHED_TARGET }}

      - uses: Swatinem/rust-cache@v2

      # Specification section 17: Cargo.toml is the only place the version lives, under
      # `[workspace.package]`, from which both packages inherit it.
      - name: Decide whether this commit is a release
        id: decide
        run: |
          version=$(awk -F'"' '
            /^\[workspace\.package\]/ { p = 1; next }
            /^\[/          { p = 0 }
            p && /^version[ \t]*=/ { print $2; exit }
          ' Cargo.toml)
          if [ -z "$version" ]; then
            echo "no version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "the manifest says $version"

          if ! grep -qF "## [$version] - " CHANGELOG.md; then
            echo "the changelog has no released heading for $version; nothing to release"
            exit 0
          fi
          if grep -F "## [$version] - " CHANGELOG.md | grep -q "Unreleased"; then
            echo "the changelog heading for $version is still unreleased; nothing to release"
            exit 0
          fi
          if ! grep -qF "[$version]: " CHANGELOG.md; then
            echo "the changelog has no comparison link for $version; nothing to release"
            exit 0
          fi
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null
          asked=$?
          set -e
          case $asked in
            0) echo "v$version is already published; leaving it alone"; exit 0 ;;
            2) ;;
            *) echo "origin could not be asked about v$version (git ls-remote exited $asked)"
               exit 1 ;;
          esac
          echo "release=true" >> "$GITHUB_OUTPUT"

      # Specification section 17 states the release is consistent when the version of
      # `--version`, of Cargo.toml, and of the tag agree. The binary asked here is the
      # one that will be published, not a host build that happens to sit beside it.
      - name: Build the binary that will be published
        if: steps.decide.outputs.release == 'true'
        run: |
          cargo build --release --locked --target "$PUBLISHED_TARGET"
          binary="target/$PUBLISHED_TARGET/release/kakoi"
          printed=$("$binary" --version)
          expected="kakoi ${{ steps.decide.outputs.version }}"
          if [ "$printed" != "$expected" ]; then
            echo "--version prints '$printed', the manifest says '$expected'"
            exit 1
          fi
          echo "$printed"
          file "$binary"

      # The archive's name is what an installer reads to decide the download fits the
      # machine, so the target triple stays in it. The binary sits at the root of the
      # archive: a directory inside would leave finding it to the installer.
      - name: Package the binary
        id: package
        if: steps.decide.outputs.release == 'true'
        run: |
          version=${{ steps.decide.outputs.version }}
          name="kakoi-v$version-$PUBLISHED_TARGET"
          mkdir -p dist
          cp "target/$PUBLISHED_TARGET/release/kakoi" dist/
          tar -czf "$name.tar.gz" -C dist kakoi
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          tar -tzf "$name.tar.gz"
          cat "$name.tar.gz.sha256"
          echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Take the release notes from the changelog
        if: steps.decide.outputs.release == 'true'
        run: |
          awk -v v="${{ steps.decide.outputs.version }}" '
            index($0, "## [" v "] - ") == 1 { f = 1; next }
            f && index($0, "## ") == 1      { exit }
            f && /^\[[^]]+\]: /             { exit }
            f                               { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "the changelog section for this version is empty"
            exit 1
          fi
          cat notes.md

      - name: Create the tag and the release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ steps.decide.outputs.version }}
          archive=${{ steps.package.outputs.archive }}
          gh release create "v$version" \
            --title "v$version" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            "$archive" "$archive.sha256"

      # The tag exists once the command above returns. A release whose files failed to
      # upload would leave an installer with nothing to fetch, so what the release now
      # carries is read back rather than assumed.
      - name: Check that the release carries the binary and its checksum
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ steps.decide.outputs.version }}
          gh release view "v$version" --json assets -q '.assets[].name'
          count=$(gh release view "v$version" --json assets -q '.assets | length')
          if [ "$count" -ne 2 ]; then
            echo "the release carries $count files, expected the archive and its checksum"
            exit 1
          fi
