# Observes how kakoi starts on Ubuntu with the user namespace restriction left on, the
# default since 23.10. `filtered` makes user namespaces outside bwrap (kakoi itself and
# pasta), so the bwrap AppArmor profile alone may not cover it, and no one has tried it.
# This records what happens; it asserts nothing yet, because what it should assert is
# decided from what it shows. Started by hand until then.
name: User namespace restriction

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  observe:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install bubblewrap and nftables
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap nftables iproute2
          bwrap --version
          nft --version

      # The same verified build CI uses. Here it goes on PATH, where the product looks.
      - name: Fetch the verified pasta
        run: |
          url=https://deb.debian.org/debian/pool/main/p/passt/passt_0.0~git20260728.f8df3f1-1~bpo13+1_amd64.deb
          curl -fsSLo "$RUNNER_TEMP/passt.deb" "$url"
          echo "c8ac47eb51979289f8bbb1761d9954cf1ee8dd1ac42ea5d2ce5136330099f43a  $RUNNER_TEMP/passt.deb" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/passt.deb" "$RUNNER_TEMP/passt"
          echo "$RUNNER_TEMP/passt/usr/bin" >> "$GITHUB_PATH"

      - name: Build kakoi
        run: cargo build --release --locked

      # Each case runs the same two launches: the default host network, which only bwrap
      # needs a namespace for, and `filtered` reaching one allowed address. A case prints
      # the exit code and kakoi's and bwrap's messages, and never fails the job.
      - name: Observe the launches
        run: |
          kakoi=$PWD/target/release/kakoi
          policy=$RUNNER_TEMP/filtered.toml
          cat > "$policy" <<'EOF'
          [network]
          mode = "filtered"

          [[network.allow]]
          destination = { ip = "1.1.1.1" }
          protocol = "tcp"
          ports = ["443"]
          EOF
          reach='import socket; socket.create_connection(("1.1.1.1", 443), 5).close(); print("reached 1.1.1.1:443")'
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          launch() {
            local label=$1; shift
            echo "::group::$label"
            set +e
            timeout 60 "$@" > "$RUNNER_TEMP/out" 2>&1
            local code=$?
            set -e
            cat "$RUNNER_TEMP/out"
            echo "exit $code"
            echo "::endgroup::"
            {
              echo "### $label"
              echo "exit $code"
              echo '```'
              head -c 4000 "$RUNNER_TEMP/out"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          case_of() {
            local name=$1
            launch "$name: host" "$kakoi" -- true
            launch "$name: filtered" "$kakoi" --policy-file "$policy" -- python3 -c "$reach"
          }

          echo "restriction: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
          sudo aa-status | grep -i bwrap || echo "no bwrap profile loaded"
          ls -l "$profile"

          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          case_of "restricted"

          sudo apparmor_parser -r "$profile"
          case_of "restricted, bwrap profile"
          sudo apparmor_parser -R "$profile"

          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          case_of "unrestricted"
