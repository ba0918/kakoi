# The root package is the `kakoi` binary, so that `cargo install --git` and a release
# build at the root keep working; the library it is built on is the member below.
[workspace]
members = ["crates/kakoi-core"]

# Specification section 17: the version lives in one place. Both packages inherit it.
[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ba0918/kakoi"

# The exact pins, written once for every member.
[workspace.dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.5"

[package]
name = "kakoi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Run a command inside a bubblewrap mount namespace shaped by a layered policy."
license.workspace = true
repository.workspace = true
include = [
    "/src/**",
    "/examples/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
]

[profile.release]
# The published binary carries no symbol table: about a fifth off its size, at the cost
# of a panic backtrace naming addresses instead of functions. A panic here is a defect to
# reproduce from the diagnostic and the command line, not to read out of a user's trace.
strip = true

[dependencies]
clap.workspace = true
kakoi-core = { path = "crates/kakoi-core" }
serde.workspace = true
serde_json.workspace = true

# The tests that observe the seccomp filter and the raised file limit make raw calls.
[dev-dependencies]
libc.workspace = true
