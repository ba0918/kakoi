[package]
name = "kakoi"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Run a command inside a bubblewrap mount namespace shaped by a layered policy."
license = "MIT"
repository = "https://github.com/ba0918/kakoi"
include = [
    "/src/**",
    "/examples/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
]

[profile.release]
# The published binary carries no symbol table: about a fifth off its size, at the cost
# of a panic backtrace naming addresses instead of functions. A panic here is a defect to
# reproduce from the diagnostic and the command line, not to read out of a user's trace.
strip = true

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.5"
