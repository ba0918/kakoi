  reason: >-
    利用者のPR確認・取り込み依頼に対し、呼出し側が委譲した1.88維持の技術的修正を行う。
    公式masterの入力対応実装を完全SHAで固定し、with.toolchainを1.88.0とする方式は実装担当の選択であり、利用者の直接指定ではない。
    Cargo.tomlとPROJECT.mdのMSRV、stable側、ビルド対象、ゲートと製品の動作要求は変更しない。
    比較元はmainとのmerge-baseである指定完全IDとし、その比較に含まれる設定対象の全変更はこのworkflowのみである。
    Git modeとblobおよび関連IRは通常indexを変えない代替indexのsnapshotから計算した。
    REQ-1000に従い独立レビューは未完了とし、REQ-1001に従い別比較のmain CI記録を無効化した。
