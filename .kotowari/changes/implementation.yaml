  conclusion: new
  reason: >-
    利用者の変更照合の導入依頼に対し、呼出し側が委譲した設定、ローカル検証、CI、運用指示の範囲で実装担当がA1からA4を採用した。
    hookへのchanges追加を避け、固定名の両役記録と独立レビューを用いる選択はkotowariスキルのchanges参照に基づく。
    生成物を除く対象設定、明示的なローカル比較元とPR実headの最終ゲートを導入し、既存push CIと製品の既存要求は変更しない。
    D1の役割分担とこの段階のコミット、push、公開の除外は呼出し側の委譲条件である。
