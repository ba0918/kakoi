  ir:
  - path: docs/ir/network/recovery/network-ownership.md
    sha256: sha256:b2618465f08e728f8e5547323be46e72202049400d48143ceb03c085d2059ea5
  - path: docs/ir/network/dns-work-limits/network-dns-query-limit.md
    sha256: sha256:3f9a8591dcf9ed3dfc4a93eef2724bce754abd900272990c0dc04cc09dcaa181
  conclusion: existing
  reason: >-
    利用者のmain CI修復依頼と呼出し側のRust 1.88維持条件に対し、実装担当がRust 1.99.0のclippy失敗と
    Rust 1.88.0でtry_updateが不安定機能となることを再現した。
    代替APIや自作CASループへ変えず、既存fetch_updateの呼出しを含むlet文だけでdeprecatedを許容する。
    理由を各呼出しに記し、他の警告は抑制しない。
    世代番号のchecked_addとRelaxed順序を維持してREQ-060の独立管理を変えず、
    問い合わせ残数のchecked_subとSeqCst順序を維持してREQ-122の上限消費と回数共有を変えない。
    新しい製品挙動、仕様判断、依存、workflow、最小対応版の変更はない。
  requirements:
  - REQ-060
  - REQ-122
  decisions: []
  handoff: null
  gaps: []
