  conclusion: new
  reason: >-
    組み込みAPIはポリシーのro、rw、rw-fileが示す文字デバイスとブロックデバイスをdev-bindに置き換え、
    roでも隔離内から書き込めた。CLIは同じ項目をnodevで配置し、見えるが開けない（実測）。
    利用者が選んだA1に従い、dev-bindは計画自体がdev-bindとする項目だけに残し、ほかはbind-fdとro-bind-fdにした。
    REQ-library-402のCLI挙動の維持に沿い、観測可能な例EX-library-419をIRに加えた。
    レビューの指摘を受けた利用者の判断A2に従い、比べる基準のCLIの挙動を中核IRのTBL-153の行とEX-966に書き、
    tests/launch.rsのCLI実行試験で確かめた。この試験は既存の挙動の確認で、失敗から始まる試験ではない。
    単体試験でro-bindとbindのデバイスがfd版になることを、実行試験で隔離内から読込みでも書込みでも開けないことを確認した。
    マウント後の同一性照合は全保持項目に残り、bwrap 0.9.0がbind-fdでも差し替えたパスをマウントする場合を検出する既存の試験は維持した。
    examples/library-sync/src/main.rsとbasic.rsは、基本例の移動と、基本例がdispatch_helperの後に呼ばれる前提の説明も含む。基本例の処理は変えていない。
