      "reason": "Dependabot PR #7〜#9 の更新を1つにまとめ、configure-pages v6.0.0（45bfe019）、upload-pages-artifact v5.0.0（fc324d35）、deploy-pages v5.0.1（368f8252）へ上げた。各ハッシュはgit ls-remoteでタグが指すコミットと一致し、版はコメントで併記した。リリースノート上の破壊的変更はNode.js 24への移行とupload-artifact v7で、GitHub.comのランナーで動く。使っている入力（path、id）はどの固定コミットのaction.ymlにもある。upload-pages-artifactの内部のupload-artifactもコミットハッシュで固定されている。新しいinclude-hidden-filesの既定はfalseで、_siteに隠しファイルはないため公開物は5ファイルのまま変わらない。起動条件・権限・environment・アップロード対象は変えておらず、REQ-site-102の範囲に収まる。A3（Dependabotで固定を更新）に沿った更新。actionlint 1.7.12とzizmor 1.30.1（auditor）は指摘なし。実際の公開はmainへのpush後にしか観測できない。",
