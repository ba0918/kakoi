- id: main-ci-c-abi-implementation
  base: f4d8bd099f3f5f45a87966fd4509b7ced9be62c5
  role: implementer
  files:
  - path: examples/library-sync/src/main.rs
    before: sha256:06576c73be864f833fe64d01e8e19462eedf920a1a8d91afb3166a5a0b4f9f28
    after: sha256:672d9b7a95780fc846c35e9aab83ea1dccd1ddce4f673f0720e78dc4bb635c0f
  ir:
  - path: docs/ir/library/library-integration.md
    sha256: sha256:d247c932a0d054ef3f5302e2165fa7ff2261a4c16abdc16b9451e4eb0ccc3078
  conclusion: existing
  reason: >-
    利用者のmain CI修復依頼に対し、実装担当がRust 1.99.0で既存の独立consumerビルド失敗を再現した。
    openをC ABIどおりの可変引数とし、readとwriteをc_voidポインタへ訂正する。
    可変引数のmodeは従来のu32を明示し、送受信するバイトと初期化時の故障注入は変えない。
    REQ-library-404の外部path依存実例をビルド可能に戻し、REQ-library-401のruntime単独依存を維持する。
    公開API、ポリシー、IR、workflow、依存、Rustの最小対応版は変更しない。
  requirements:
  - REQ-library-401
  - REQ-library-404
  decisions: []
  handoff: null
  gaps: []
