  ir:
  - path: docs/ir/change-review.md
    sha256: sha256:ff3b1a84ceb3b29dc4a42e389834819070340ee115afb52c1d18b8ab855a7d00
  conclusion: new
  reason: >-
    実装と別のレビューで指定基点からの全差分、実装者記録の置換、新しい判断記録を確認した。
    公式リポジトリのmaster解決とcommit APIを独立に読み取り、固定SHAのaction.yml全体を確認した。
    toolchain入力は環境変数から解析され、1.88.0は変換されずrustup installとdefaultへ渡る。
    解析ステップだけをLinux条件で実行し、toolchain=1.88.0の出力を確認した。
    workflowの意味比較ではMSRVアクション参照と明示入力だけが変わり、権限、イベント、ジョブ名、
    検査対象、コマンド、統合ゲートは不変で、Cargo.tomlとPROJECT.mdの最低対応版も維持される。
    A1は委譲された技術的選択であり、利用者によるSHA指定やMSRV変更の承認ではない。
    新しい製品動作や制約を追加しないためIR変更は不要と判断した。
    各ファイルのGit modeとblob、実装者の全関連IRを候補snapshotから独立に再計算した。
    REQ-1001に従って別比較の記録を置換し、REQ-1000に従う独立レビューとして本記録を作成する。
    actionlintは終了0。zizmorは未導入で静的セキュリティ解析は未確認であり、既存の未固定参照、
    checkoutの認証保持、ジョブ時間制限欠如は今回変更していない。
    Rustの製品テストは再実行しておらず、実際のアクション実行と候補の外部CIは未完了である。
    本判断は変更範囲のレビューであり、公開headでの再照合と必要CI成功前の統合を承認しない。
  requirements:
