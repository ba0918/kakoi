    sha256: sha256:e5bcc143245e81181104d10bd5d561d1623dff7d7bfbee27763ef7620d005570
  conclusion: new
  reason: >-
    retainはdev-bindの判定を計画自体の--dev-bindだけに絞り、ポリシーの--ro-bindと--bindが示すデバイスはbind-fdとro-bind-fdで配置されるので、
    bwrapの既定どおりnodevになり、A1とEX-library-419に合う。retained_mountsの呼出し元は組み込み経路だけで、CLIの引数は変わらない。
    隔離内initの同一性照合は全保持項目に残る。比べる基準のCLIの挙動はA2によりTBL-153の行とEX-966（REQ-167）に書かれ、
    tests/launch.rsのCLI実行試験がroとrw-fileのデバイスが文字デバイスとして見えて読み書きとも開けないことを確かめる。
    単体試験2件、library_apiの統合試験、launchの新しい試験を手元で実行し、すべて合格した。basic.rsは基本例の移動とdispatch_helperの前提の説明だけで処理は変わらない。
    A1が以前の設計記録のdev-bindの前提を読み替える点はpremise_conflict、中核IRに無かったデバイスの見え方はA2で補った点をmissing_specとして記録する。
  requirements:
  - REQ-library-402
  - REQ-library-106
  - REQ-167
  decisions:
