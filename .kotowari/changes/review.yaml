    reason: >-
      独立レビューで設定、CI、運用指示、新規IR、決定記録と実装者記録の全範囲を確認した。
      生成物を除く対象設定、PR実headとイベント両端のmerge-base、独立した両役の記録と寿命はA1からA4およびREQ-1000、REQ-1001に整合する。
      Actionsの自動更新はCI規則が求めるpin保守として導入範囲内である。
      決定の出所を再確認し、利用者の導入目的、呼出し側の委譲、スキルに基づく実装担当の選択が区別されたことを確認した。
      出所の訂正は運用上の選択と製品要求を変更せず、D1の独立レビューと最終処理の権限境界を守る。
      比較元、各変更ファイルのGit modeとblob、関連IRの全bytesを独立に照合した。
    requirements:
