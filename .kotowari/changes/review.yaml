- id: main-ci-c-abi-independent-review
  base: f4d8bd099f3f5f45a87966fd4509b7ced9be62c5
  role: reviewer
  files:
  - path: examples/library-sync/src/main.rs
    before: sha256:06576c73be864f833fe64d01e8e19462eedf920a1a8d91afb3166a5a0b4f9f28
    after: sha256:672d9b7a95780fc846c35e9aab83ea1dccd1ddce4f673f0720e78dc4bb635c0f
  ir:
  - path: docs/ir/library/library-integration.md
    sha256: sha256:d247c932a0d054ef3f5302e2165fa7ff2261a4c16abdc16b9451e4eb0ccc3078
  conclusion: existing
  reason: >-
    実装と別のレビューで全差分とELF初期化処理の呼出し側を確認し、Rust 1.99.0のGNUとmuslで
    workspace全960テストと独立sync consumerの警告をエラーにするclippyをそれぞれ再実行した。
    openのC可変引数、Linux x86_64のmodeに対応するu32、readとwriteのc_voidポインタを確認した。
    ポインタ変換はバッファの位置と長さを変えず、readの一バイト領域もu8で保持する。
    記録先、作成権限、送受信内容、停止と故障注入の順序は従来どおりである。
    REQ-library-401とREQ-library-404および利用者が採用したA15に照らし、
    consumerの直接依存がruntimeのみであることとmanifestが未変更であることを確認した。
    Rust 1.88.0での独立consumerビルドも再実行し、最小対応版を変えずに既存利用を回復すると判断した。
    各変更ファイルのGit modeとblob、および関連IR全bytesの同一性を独立に計算した。
  requirements:
  - REQ-library-401
  - REQ-library-404
  decisions: []
  handoff: null
  gaps: []
