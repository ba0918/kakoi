    sha256: sha256:b4a178870b50967eccc501582aaf5a5f007bb8aca8117dad6bfe696614e254a0
  conclusion: new
  reason: >-
    retainはdev-bindの判定を計画自体の--dev-bindだけに絞り、ポリシーの--ro-bindと--bindが示すデバイスはbind-fdとro-bind-fdで配置されるため、
    bwrapの既定どおりnodevになり、A1とEX-library-419に合う。retained_mountsの呼出し元はlaunch.rsの組み込み経路だけで、CLIの引数は変わらない。
    隔離内initの同一性照合はdevice引数に関係なく全保持項目に残っている。
    単体試験2件と統合試験public_descriptor_mounts_keep_live_content_and_devices_nodev_and_validate_identityを手元で実行し合格した。
    統合試験はrw-fileで読み書きとも開けないこと、roでnodevとroが付き開けないこと、差し替え時にPlanChangedとなることを確かめる。
    basic.rsへの移動は内容を変えていない。A1は以前の設計記録のdev-bindの前提を読み替えており（premise_conflict）、
    CLI側でデバイスがnodevになることは中核IRのTBL-153に書かれていない（missing_spec）。どちらも記録にとどめ、変更自体は正しいと判断した。
  requirements:
