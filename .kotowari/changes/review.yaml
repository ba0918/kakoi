      "reason": "base b66e91c と head fb877ec の差分のうちワークフローは .github/workflows/pages.yml の uses 3行だけで、残りは実装者の記録。git ls-remote で configure-pages v6.0.0=45bfe019、upload-pages-artifact v5.0.0=fc324d35、deploy-pages v5.0.1=368f8252 がタグの指すコミットと一致し（いずれも注釈なしタグ）、Dependabot PR #7〜#9 の差分とも一致した。固定コミットの action.yml では configure-pages と deploy-pages は node24、upload-pages-artifact は composite で内部の actions/upload-artifact を bbbca2dd（ls-remote で v7.0.0 と一致、node24）にハッシュ固定している。使う入力 path は upload-pages-artifact にあり、environment の url が参照する deploy-pages の page_url 出力も残っている。リリースノートの変更は Node.js 24 移行、upload-artifact v7（ESM 化と archive 入力の追加、既定は従来どおり zip）、include-hidden-files 入力の追加、デプロイ状態の問い合わせへの backoff 追加で、このワークフローの使い方を変えない。旧 v4 の action.yml も隠しファイルを --exclude=.[^/]* で除いており、新版の既定 false と同じ。head で site/build.py と check.py を実行すると _site は index.html、messages.js、style.css、app.js、language-preference.js の5ファイルで隠しファイルはなく、公開物は変わらない。起動条件・permissions・github-pages environment・timeout・アップロード対象は変わらず REQ-site-102 を満たし続ける。外部アクションをハッシュで固定し Dependabot（github-actions、7日猶予）で更新する点は A3 に沿う。actionlint 1.7.12 と zizmor 1.30.1（auditor、offline）は指摘なし。実際の公開は main への push 後にしか観測できない。",
