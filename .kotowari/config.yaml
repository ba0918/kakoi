ir: docs/ir
decisions:
  records: docs/decision/brainstorm
  adr: docs/decision/brainstorm
tests:
  files:
    - "tests/*.rs"
    - "tests/**/*.rs"
    - "crates/kakoi-runtime/src/**/*.rs"
  rust:
    attributes: []
    macros: []
guides:
  files:
    - "docs/guide/*.md"
    - "docs/guide/**/*.md"
changes:
  files:
    - "src/**"
    - "crates/**"
    - "tests/**"
    - "examples/**"
    - "skills/**"
    - "site/**"
    - "tools/**"
    - "Cargo.toml"
    - "Cargo.lock"
    - "build.rs"
    - "rust-toolchain*"
    - ".cargo/**"
    - "lefthook.yml"
    - ".claude/hooks/**"
    - ".claude/settings.json"
    - ".github/**"
    - "AGENTS.md"
    - "PROJECT.md"
    - ".gitignore"
    - ".ignore"
  exclude:
    - "target/**"
    - "**/target/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
  records:
    - ".kotowari/changes/*.yaml"
limits:
  lines: 200
  requirements: 10
vague_words:
  - "適切に"
  - "必要に応じて"
  - "通常は"
  - "など"
